name: Temporary ALPS multi-target install validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5

      - name: Install and inspect supported targets
        run: |
          set -u
          failures=0

          for target in claude-code cursor codex vscode; do
            echo "::group::Target ${target}"
            home="$RUNNER_TEMP/home-${target}"
            source="$RUNNER_TEMP/source-${target}"
            consumer="$RUNNER_TEMP/consumer-${target}"
            mkdir -p "$home" "$source" "$consumer"
            cp -a "$GITHUB_WORKSPACE/." "$source/"

            if (
              export HOME="$home"
              cd "$consumer"
              npx --yes plugins add "$source" --target "$target" --scope user --yes
            ); then
              rm -rf "$source"
              TARGET="$target" TEST_HOME="$home" TEST_CONSUMER="$consumer" python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          home = Path(os.environ["TEST_HOME"])
          consumer = Path(os.environ["TEST_CONSUMER"])
          skills: list[Path] = []
          specs: list[Path] = []
          manifests: list[Path] = []

          for root in (home, consumer):
              if not root.exists():
                  continue
              skills.extend(
                  path
                  for path in root.rglob("SKILL.md")
                  if path.parts[-2:] == ("define-alps", "SKILL.md")
              )
              specs.extend(root.rglob("ALPS-SPEC.md"))
              for path in root.rglob("plugin.json"):
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError):
                      continue
                  if '"name": "alps"' in text:
                      manifests.append(path)

          print(f"TARGET: {target}")
          print("DEFINE SKILLS")
          for skill in skills:
              expected = (skill.parent / "../../.alps/spec/ALPS-SPEC.md").resolve()
              print(f"- {skill}")
              print(f"  expected shared spec: {expected}")
              print(f"  resolves: {expected.is_file()}")

          print("ALPS SPECS")
          for path in specs:
              print(f"- {path}")

          print("ALPS MANIFESTS")
          for path in manifests:
              print(f"- {path}")

          print("CONFIG FILES REFERENCING ALPS")
          for path in home.rglob("*"):
              if not path.is_file() or path.stat().st_size > 1_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if "alps" in text.lower():
                  print(f"- {path}")

          if not skills:
              raise SystemExit("No installed define-alps/SKILL.md was found after removing the source copy")

          broken = [
              skill
              for skill in skills
              if not (skill.parent / "../../.alps/spec/ALPS-SPEC.md").resolve().is_file()
          ]
          if broken:
              raise SystemExit(
                  "Installed Skill shared-reference resolution failed:\n"
                  + "\n".join(str(path) for path in broken)
              )

          print("Every installed define-alps Skill resolves the shared ALPS specification.")
          PY
              inspect_status=$?
              if [ "$inspect_status" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            else
              echo "Install failed for target ${target}"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          exit "$failures"
