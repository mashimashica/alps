name: Temporary ALPS documentation and install validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin main

      - name: Validate Skill Descriptions
        run: |
          python3 skills/define-alps/scripts/check_skill_description.py skills/define-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/apply-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/manage-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/define-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/apply-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/manage-alps/references/locales/ja/SKILL.md

      - name: Check the pull request diff
        run: git diff --check origin/main...HEAD

      - name: Verify relative links in changed Markdown files
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMRT",
                  "origin/main...HEAD",
                  "--",
                  "*.md",
              ],
              text=True,
          ).splitlines()

          link_pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          scheme_pattern = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          fence_pattern = re.compile(r"^\s*(```|~~~)")
          errors: list[str] = []

          for filename in changed:
              source = Path(filename)
              if not source.is_file():
                  continue
              in_fence = False
              fence = ""
              for line_number, line in enumerate(
                  source.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  fence_match = fence_pattern.match(line)
                  if fence_match:
                      marker = fence_match.group(1)
                      if not in_fence:
                          in_fence = True
                          fence = marker
                      elif marker == fence:
                          in_fence = False
                          fence = ""
                      continue
                  if in_fence:
                      continue
                  for match in link_pattern.finditer(line):
                      raw_target = match.group(1).strip()
                      if raw_target.startswith("<") and raw_target.endswith(">"):
                          raw_target = raw_target[1:-1].strip()
                      if not raw_target:
                          continue
                      target = raw_target.split(maxsplit=1)[0]
                      if target.startswith(("#", "/", "//")) or scheme_pattern.match(target):
                          continue
                      local_path = unquote(target.split("#", 1)[0].split("?", 1)[0])
                      if local_path and not (source.parent / local_path).resolve().exists():
                          errors.append(
                              f"{filename}:{line_number}: unresolved relative link {target!r}"
                          )

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated relative links in {len(changed)} changed Markdown file(s).")
          PY

      - name: Verify README and AGENTS guidance alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pairs = (
              ("README.md", "AGENTS.md", (
                  "For each substantive request, use the ALPS Reference Model to select the applicable reference Skills from `define-alps`, `apply-alps`, and `manage-alps`.",
                  "Identify other ALPS-conformant Skills by the `ALPS-conformant.` marker at the end of `description`, then assess their fit from the discovery description.",
                  "Read each selected Skill's complete `SKILL.md` before applying it.",
                  "Use `apply-alps` for existing Skills, `define-alps` for an unmet need or Skill redefinition, and `manage-alps` for adoption, Tailoring, assessment, change, or retirement.",
                  "When combining Skills, make every Output/Input handoff explicit.",
              )),
              ("docs/ja/README.md", "docs/ja/AGENTS.md", (
                  "実質的な依頼ごとに、ALPS Reference Modelを基準として、`define-alps`、`apply-alps`および`manage-alps`から適用する参照Skillを選択します。",
                  "その他のALPS準拠Skillは、`description`末尾の`ALPS準拠。`表示によって識別し、発見用の記述から依頼への適合性を判断します。",
                  "選択した各Skillの`SKILL.md`を、適用前に最後まで読みます。",
                  "既存Skillを適用する作業には`apply-alps`、未充足ニーズまたはSkillの再定義には`define-alps`、採用、Tailoring、評価、変更または廃止には`manage-alps`を用います。",
                  "複数Skillを組み合わせる場合は、すべてのOutput/Inputの授受を明示します。",
              )),
          )

          failures: list[str] = []
          for readme_path, agents_path, policy in pairs:
              readme = Path(readme_path).read_text(encoding="utf-8")
              agents = Path(agents_path).read_text(encoding="utf-8")
              for statement in policy:
                  if statement not in readme:
                      failures.append(f"{readme_path}: missing {statement!r}")
                  if statement not in agents:
                      failures.append(f"{agents_path}: missing {statement!r}")

          english = Path("README.md").read_text(encoding="utf-8")
          japanese = Path("docs/ja/README.md").read_text(encoding="utf-8")
          if "Copying only `skills/` is not a complete ALPS installation." not in english:
              failures.append("README.md: missing complete-package installation warning")
          if "`skills/`だけをコピーしても、完全なALPSのインストールにはなりません。" not in japanese:
              failures.append("docs/ja/README.md: missing complete-package installation warning")
          if "canonical minimal policy" not in english:
              failures.append("README.md: missing canonical consumer policy declaration")
          if "正本となる最小方針" not in japanese:
              failures.append("docs/ja/README.md: missing canonical consumer policy declaration")

          if failures:
              raise SystemExit("\n".join(failures))

          print("README and AGENTS guidance is aligned in English and Japanese.")
          PY

      - name: Install GitHub Copilot CLI for native plugin validation
        run: npm install -g @github/copilot

      - name: Install and inspect available client targets
        run: |
          set -u
          failures=0

          for target in claude-code cursor codex github-copilot vscode; do
            echo "::group::Target ${target}"
            home="$RUNNER_TEMP/home-${target}"
            source_parent="$RUNNER_TEMP/source-${target}"
            source="$source_parent/alps"
            consumer="$RUNNER_TEMP/consumer-${target}"
            mkdir -p "$home" "$source" "$consumer"
            cp -a "$GITHUB_WORKSPACE/." "$source/"

            if (
              export HOME="$home"
              cd "$consumer"
              npx --yes plugins add "$source" --target "$target" --scope user --yes
            ); then
              rm -rf "$source_parent"
              TARGET="$target" TEST_HOME="$home" TEST_CONSUMER="$consumer" python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          home = Path(os.environ["TEST_HOME"])
          consumer = Path(os.environ["TEST_CONSUMER"])
          skills: list[Path] = []

          for root in (home, consumer):
              if root.exists():
                  skills.extend(
                      path
                      for path in root.rglob("SKILL.md")
                      if path.parts[-2:] == ("define-alps", "SKILL.md")
                  )

          if not skills:
              raise SystemExit(
                  f"{target}: no installed define-alps/SKILL.md after removing source"
              )

          broken = [
              skill
              for skill in skills
              if not (skill.parent / "../../.alps/spec/ALPS-SPEC.md").resolve().is_file()
          ]
          if broken:
              raise SystemExit(
                  f"{target}: shared-reference resolution failed:\n"
                  + "\n".join(str(path) for path in broken)
              )

          print(f"{target}: {len(skills)} installed Skill copy or copies resolve .alps/spec.")
          PY
              inspect_status=$?
              if [ "$inspect_status" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            else
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          exit "$failures"
