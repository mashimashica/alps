name: Finalize Local Runtime conformance fixes

on:
  pull_request:
    branches:
      - feat/local-runtime-v0-alpha
    paths:
      - .github/materialize/final-conformance-fixes.py
      - .github/workflows/finalize-conformance-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source corrections
        run: |
          python .github/materialize/final-conformance-fixes.py
          gofmt -w cmd/alps internal
          go get modernc.org/sqlite@v1.56.0
          go mod tidy
          npm --prefix web install --package-lock-only --no-audit --no-fund
      - name: Validate backend
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Validate and build frontend
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run check
          npm --prefix web test
          npm --prefix web run build
      - name: Embed frontend
        run: |
          rm -rf internal/web/static
          mkdir -p internal/web/static/assets
          cp -a web/build/. internal/web/static/
          cp assets/icon.svg internal/web/static/assets/icon.svg
          python - <<'PY'
          from pathlib import Path
          for path in Path('internal/web/static').rglob('*'):
              if path.is_file() and path.suffix in {'.html', '.css', '.js', '.json', '.svg'}:
                  text = path.read_text()
                  trailing_newline = text.endswith('\n')
                  normalized = '\n'.join(line.rstrip() for line in text.splitlines())
                  if trailing_newline:
                      normalized += '\n'
                  path.write_text(normalized)
          PY
      - name: Browser smoke
        run: |
          npx --prefix web playwright install --with-deps chromium
          WORKSPACE=$(mktemp -d)
          go build -o /tmp/alps-conformance ./cmd/alps
          /tmp/alps-conformance serve --workspace "$WORKSPACE" --root . --addr 127.0.0.1:18790 >/tmp/alps-conformance.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -rf "$WORKSPACE"' EXIT
          for attempt in $(seq 1 150); do
            curl -fsS http://127.0.0.1:18790/v1/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18790/v1/health >/dev/null
          ALPS_E2E_URL=http://127.0.0.1:18790 npm --prefix web run test:e2e
      - name: Check generated state
        run: |
          git diff --check
          test ! -e web/node_modules/.package-lock.json || true
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/materialize/final-conformance-fixes.py .github/workflows/finalize-conformance-fixes.yml
          git add -u
          git commit --signoff -m 'feat: finalize Local Runtime v0 contracts and tooling'
          git push origin HEAD:feat/local-runtime-v0-conformance
