name: Export Local Runtime conformance worktree

on:
  push:
    branches:
      - feat/local-runtime-v0-conformance
    paths:
      - .github/workflows/export-conformance-worktree.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - name: Export clean worktree
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-v0-conformance-current
          path: |
            .
            !.git
            !web/test-results
            !web/playwright-report
          include-hidden-files: true
          retention-days: 1
      - name: Remove export workflow
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/workflows/export-conformance-worktree.yml
          git commit --signoff -m 'ci: remove conformance worktree exporter'
          git push origin HEAD:feat/local-runtime-v0-conformance
