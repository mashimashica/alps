name: Temporary Agent Plugins migration validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin main

      - name: Validate authoritative English Skill Descriptions
        run: |
          python3 skills/define-alps/scripts/check_skill_description.py skills/define-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/apply-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/manage-alps/SKILL.md

      - name: Validate Japanese Skill localizations
        run: |
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/define-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/apply-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/manage-alps/references/locales/ja/SKILL.md

      - name: Check the pull request diff for whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Verify relative links in changed Markdown files
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMRT",
                  "origin/main...HEAD",
                  "--",
                  "*.md",
              ],
              text=True,
          ).splitlines()

          link_pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          scheme_pattern = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          errors: list[str] = []

          for filename in changed:
              source = Path(filename)
              if not source.is_file():
                  continue
              text = source.read_text(encoding="utf-8")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  for match in link_pattern.finditer(line):
                      raw_target = match.group(1).strip()
                      if raw_target.startswith("<") and raw_target.endswith(">"):
                          raw_target = raw_target[1:-1].strip()
                      if not raw_target:
                          continue
                      target = raw_target.split(maxsplit=1)[0]
                      if (
                          target.startswith(("#", "/", "//"))
                          or scheme_pattern.match(target)
                      ):
                          continue
                      local_path = unquote(target.split("#", 1)[0].split("?", 1)[0])
                      if not local_path:
                          continue
                      resolved = (source.parent / local_path).resolve()
                      if not resolved.exists():
                          errors.append(
                              f"{filename}:{line_number}: unresolved relative link {target!r}"
                          )

          if errors:
              print("Relative-link validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated relative links in {len(changed)} changed Markdown file(s).")
          PY

      - name: Confirm migrated identifiers and paths
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          allowed = {
              "CHANGELOG.md",
              "docs/releases/0.2.0.md",
          }
          old_tokens = (
              "define-agent-lifecycle-process-skills",
              "apply-agent-lifecycle-process-skills",
              "manage-agent-lifecycle-process-skills",
              ".agents/skills/",
          )
          failures: list[str] = []

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          for filename in tracked:
              if filename in allowed:
                  continue
              path = Path(filename)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in old_tokens:
                  if token in text:
                      failures.append(f"{filename}: stale token {token!r}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("No stale Skill identifiers or .agents/skills paths remain outside migration records.")
          PY
