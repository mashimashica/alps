name: Local Runtime v0

on:
  pull_request:
    paths:
      - cmd/alps/**
      - internal/**
      - scripts/local-runtime-smoke.sh
      - go.mod
      - go.sum
      - .github/workflows/local-runtime-v0.yml
  push:
    branches:
      - feat/local-runtime-v0
    paths:
      - cmd/alps/**
      - internal/**
      - scripts/local-runtime-smoke.sh
      - go.mod
      - go.sum
      - .github/workflows/local-runtime-v0.yml

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download modules
        run: go mod download
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Check JavaScript syntax
        run: node --check internal/web/static/app.js
      - name: Check shell syntax
        run: bash -n scripts/local-runtime-smoke.sh
      - name: Check whitespace
        run: git diff --check
