name: Local Runtime v0

on:
  pull_request:
    paths:
      - cmd/alps/**
      - internal/**
      - scripts/local-runtime-*.sh
      - README.local-runtime.md
      - go.mod
      - go.sum
      - web/**
      - schemas/**
      - migrations/**
      - integrations/**
      - .github/workflows/local-runtime-v0.yml
  push:
    branches:
      - feat/local-runtime-v0
      - feat/local-runtime-v0-conformance
    paths:
      - cmd/alps/**
      - internal/**
      - scripts/local-runtime-*.sh
      - README.local-runtime.md
      - go.mod
      - go.sum
      - web/**
      - schemas/**
      - migrations/**
      - integrations/**
      - .github/workflows/local-runtime-v0.yml

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export implementation worktree
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-v0-conformance-worktree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download modules
        run: go mod download
      - name: Verify module files are normalized
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test Go packages
        run: go test ./...
      - name: Test Go packages with race detector
        run: go test -race ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Check JavaScript syntax
        run: node --check internal/web/static/app.js
      - name: Check shell syntax
        run: |
          bash -n scripts/local-runtime-smoke.sh
          bash -n scripts/local-runtime-acceptance.sh
      - name: Run smoke test
        run: bash scripts/local-runtime-smoke.sh
      - name: Run acceptance test
        run: bash scripts/local-runtime-acceptance.sh
      - name: Check whitespace
        run: git diff --check
