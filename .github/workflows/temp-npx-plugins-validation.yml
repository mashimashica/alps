name: Temporary ALPS usage documentation validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin main

      - name: Validate authoritative English Skill Descriptions
        run: |
          python3 skills/define-alps/scripts/check_skill_description.py skills/define-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/apply-alps/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py skills/manage-alps/SKILL.md

      - name: Validate Japanese Skill localizations
        run: |
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/define-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/apply-alps/references/locales/ja/SKILL.md
          python3 skills/define-alps/scripts/check_skill_description.py --locale ja skills/manage-alps/references/locales/ja/SKILL.md

      - name: Check the pull request diff for whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Verify relative links in changed Markdown files
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMRT",
                  "origin/main...HEAD",
                  "--",
                  "*.md",
              ],
              text=True,
          ).splitlines()

          link_pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          scheme_pattern = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          fence_pattern = re.compile(r"^\s*(```|~~~)")
          errors: list[str] = []

          for filename in changed:
              source = Path(filename)
              if not source.is_file():
                  continue
              text = source.read_text(encoding="utf-8")
              in_fence = False
              fence = ""
              for line_number, line in enumerate(text.splitlines(), start=1):
                  fence_match = fence_pattern.match(line)
                  if fence_match:
                      marker = fence_match.group(1)
                      if not in_fence:
                          in_fence = True
                          fence = marker
                      elif marker == fence:
                          in_fence = False
                          fence = ""
                      continue
                  if in_fence:
                      continue
                  for match in link_pattern.finditer(line):
                      raw_target = match.group(1).strip()
                      if raw_target.startswith("<") and raw_target.endswith(">"):
                          raw_target = raw_target[1:-1].strip()
                      if not raw_target:
                          continue
                      target = raw_target.split(maxsplit=1)[0]
                      if (
                          target.startswith(("#", "/", "//"))
                          or scheme_pattern.match(target)
                      ):
                          continue
                      local_path = unquote(target.split("#", 1)[0].split("?", 1)[0])
                      if not local_path:
                          continue
                      resolved = (source.parent / local_path).resolve()
                      if not resolved.exists():
                          errors.append(
                              f"{filename}:{line_number}: unresolved relative link {target!r}"
                          )

          if errors:
              print("Relative-link validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated relative links in {len(changed)} changed Markdown file(s).")
          PY

      - name: Verify paired usage documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "README.md": (
                  "## Using ALPS",
                  "npx plugins add mashimashica/alps",
                  "### Invoke a reference Skill explicitly",
                  "### Add repository guidance",
                  "This repository uses the ALPS Reference Model.",
              ),
              "docs/ja/README.md": (
                  "## ALPSを利用する",
                  "npx plugins add mashimashica/alps",
                  "### 参照Skillを明示的に呼び出す",
                  "### AGENTS.mdに利用方針を記載する",
                  "本リポジトリではALPS Reference Modelを使用する。",
              ),
          }

          failures: list[str] = []
          for filename, required in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              for value in required:
                  if value not in text:
                      failures.append(f"{filename}: missing {value!r}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("English and Japanese usage documentation is present and paired.")
          PY

      - name: Discover the Agent Plugin package with npx plugins
        run: npx --yes plugins discover .

      - name: Install ALPS into a scratch client configuration
        run: |
          mkdir -p "$RUNNER_TEMP/alps-consumer"
          cd "$RUNNER_TEMP/alps-consumer"
          npx --yes plugins add "$GITHUB_WORKSPACE" --target vscode --scope project --yes
