name: Materialize Local Runtime acceptance suite

on:
  pull_request:
    branches:
      - feat/local-runtime-v0-alpha
    paths:
      - .github/materialize/acceptance-payload.py
      - .github/materialize/acceptance-fixes.py
      - .github/workflows/materialize-acceptance.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Materialize acceptance suite
        run: |
          python .github/materialize/acceptance-payload.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/local-runtime-acceptance.sh')
          value = path.read_text()
          value = value.replace(
              'responses={row.get("id"): row for row in rows if "id" in row}\nassert responses[1]["result"]["protocolVersion"]\ntools=responses[2]["result"]["tools"]',
              'responses={str(row.get("id")): row for row in rows if "id" in row}\nassert responses["1"]["result"]["protocolVersion"]\ntools=responses["2"]["result"]["tools"]',
          )
          value = value.replace(
              'assert responses[3]["result"].get("content") or responses[3]["result"].get("structuredContent") is not None',
              'assert responses["3"]["result"].get("content") or responses["3"]["result"].get("structuredContent") is not None',
          )
          path.write_text(value)
          PY
          python .github/materialize/acceptance-fixes.py
          gofmt -w internal/runtime/models.go internal/mcp/mcp.go
          chmod +x scripts/local-runtime-acceptance.sh
          bash -n scripts/local-runtime-acceptance.sh
          go test ./...
      - name: Run acceptance suite
        run: bash scripts/local-runtime-acceptance.sh
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/materialize/acceptance-payload.py .github/materialize/acceptance-fixes.py .github/workflows/materialize-acceptance.yml
          git add scripts/local-runtime-acceptance.sh internal/runtime/models.go internal/mcp/mcp.go
          git commit --signoff -m 'test: add Local Runtime v0 conformance acceptance suite'
          git push origin HEAD:feat/local-runtime-v0-conformance
