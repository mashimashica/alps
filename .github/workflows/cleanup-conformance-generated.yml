name: Cleanup Local Runtime generated frontend files

on:
  push:
    branches:
      - feat/local-runtime-v0-conformance
    paths:
      - .github/workflows/cleanup-conformance-generated.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - name: Remove generated dependency and build trees
        run: |
          git rm -r --ignore-unmatch web/node_modules web/.svelte-kit web/build
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/workflows/cleanup-conformance-generated.yml
          git commit --signoff -m 'build: remove generated frontend trees'
          git push origin HEAD:feat/local-runtime-v0-conformance
