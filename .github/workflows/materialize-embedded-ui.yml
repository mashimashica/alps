name: Materialize embedded Local Runtime UI

on:
  pull_request:
    branches:
      - feat/local-runtime-v0-alpha
    paths:
      - .github/workflows/materialize-embedded-ui.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Svelte application
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run check
          npm --prefix web test
          npm --prefix web run build
      - name: Materialize embedded assets
        run: |
          rm -rf internal/web/static
          mkdir -p internal/web/static/assets
          cp -a web/build/. internal/web/static/
          cp assets/icon.svg internal/web/static/assets/icon.svg
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          root = Path('internal/web/static')
          bootstrap = root / '_app' / 'bootstrap'
          bootstrap.mkdir(parents=True, exist_ok=True)
          pattern = re.compile(r'<script>(.*?)</script>', re.DOTALL)
          for html in root.rglob('*.html'):
              source = html.read_text()
              def externalize(match):
                  code = match.group(1).strip()
                  if not code:
                      return match.group(0)
                  name = sha256(code.encode()).hexdigest()[:20] + '.js'
                  (bootstrap / name).write_text(code + '\n')
                  return f'<script src="/_app/bootstrap/{name}"></script>'
              html.write_text(pattern.sub(externalize, source))
          for path in root.rglob('*'):
              if path.is_file() and path.suffix in {'.html', '.css', '.js', '.json', '.svg'}:
                  text = path.read_text()
                  trailing_newline = text.endswith('\n')
                  normalized = '\n'.join(line.rstrip() for line in text.splitlines())
                  if trailing_newline:
                      normalized += '\n'
                  path.write_text(normalized)
          PY
      - name: Validate embedded application
        run: |
          npx --prefix web playwright install --with-deps chromium
          WORKSPACE=$(mktemp -d)
          go build -o /tmp/alps-ui ./cmd/alps
          /tmp/alps-ui serve --workspace "$WORKSPACE" --root . --addr 127.0.0.1:18790 >/tmp/alps-ui.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -rf "$WORKSPACE"' EXIT
          for attempt in $(seq 1 150); do
            curl -fsS http://127.0.0.1:18790/v1/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18790/v1/health >/dev/null
          ALPS_E2E_URL=http://127.0.0.1:18790 npm --prefix web run test:e2e
          git diff --check
      - name: Commit generated assets
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/workflows/materialize-embedded-ui.yml
          git add -A internal/web/static
          git commit --signoff -m 'build: embed Local Runtime Svelte application'
          git push origin HEAD:feat/local-runtime-v0-conformance
