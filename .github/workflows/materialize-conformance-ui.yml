name: Materialize Local Runtime conformance UI

on:
  pull_request:
    branches:
      - feat/local-runtime-v0-alpha
    paths:
      - .github/materialize/conformance-ui-fixes.py
      - .github/workflows/materialize-conformance-ui.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_COMMIT: 90db0a9859b517ca61a52f16ff7a3cea665010ce
      ADDRESS: 127.0.0.1:18790
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-runtime-v0-conformance
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode UI and contract payload
        run: |
          git fetch origin "$PAYLOAD_COMMIT"
          : > /tmp/conformance-ui.b64
          for part in $(seq -f '%02g' 0 2); do
            git show "$PAYLOAD_COMMIT:.github/materialize/ui/part${part}" >> /tmp/conformance-ui.b64
          done
          base64 --decode /tmp/conformance-ui.b64 > /tmp/conformance-ui.tar.xz
          tar -xJf /tmp/conformance-ui.tar.xz -C .
          python .github/materialize/conformance-ui-fixes.py
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Check frontend
        working-directory: web
        run: |
          npm run check
          npm run test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Embed production assets
        run: |
          rm -rf internal/web/static
          mkdir -p internal/web/static/assets
          cp -a web/build/. internal/web/static/
          cp assets/icon.svg internal/web/static/assets/icon.svg
          cat > internal/web/web.go <<'EOF'
          package web

          import "embed"

          // Files contains the built ALPS Local Runtime web application.
          //
          //go:embed all:static
          var Files embed.FS
          EOF
          gofmt -w internal/web/web.go
      - name: Validate contracts and backend
        run: |
          python -m json.tool schemas/process-model/v1alpha1.schema.json >/dev/null
          python -m json.tool schemas/events/domain-event.schema.json >/dev/null
          python -m json.tool schemas/hooks/canonical-envelope.schema.json >/dev/null
          python -m json.tool schemas/telemetry/usage-observation.schema.json >/dev/null
          go mod tidy
          git diff --check
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Browser acceptance
        run: |
          npx --prefix web playwright install --with-deps chromium
          WORKSPACE=$(mktemp -d)
          go build -o /tmp/alps-conformance ./cmd/alps
          /tmp/alps-conformance serve --workspace "$WORKSPACE" --root . --addr "$ADDRESS" >/tmp/alps-conformance.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -rf "$WORKSPACE"' EXIT
          for attempt in $(seq 1 100); do
            curl -fsS "http://$ADDRESS/v1/health" >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS "http://$ADDRESS/v1/health" >/dev/null
          ALPS_E2E_URL="http://$ADDRESS" npm --prefix web run test:e2e
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: Mashimashica
          GIT_AUTHOR_EMAIL: 43808210+mashimashica@users.noreply.github.com
          GIT_COMMITTER_NAME: Mashimashica
          GIT_COMMITTER_EMAIL: 43808210+mashimashica@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git rm .github/workflows/materialize-conformance-ui.yml .github/materialize/conformance-ui-fixes.py
          git add .alps/process-model.yaml web schemas migrations integrations tests/fixtures internal/web go.mod go.sum
          git commit --signoff -m 'feat: implement Local Runtime v0 conformance UI and contracts'
          git push origin HEAD:feat/local-runtime-v0-conformance
