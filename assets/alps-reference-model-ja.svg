<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ALPS参照モデル</title>
  <desc id="desc">Define ALPS、Manage ALPS、Apply ALPSと、四つの方向付き情報フローを示す図。</desc>
  <defs>
    <marker id="arrowPrimary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#168FC7"/>
    </marker>
    <marker id="arrowFeedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#61788A"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, Inter, ui-sans-serif, system-ui, sans-serif; }
      .name { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; fill: #0B1F33; }
      .body { font-size: 16px; font-weight: 450; fill: #586F81; }
      .label { font-size: 13px; font-weight: 600; fill: #415A6D; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="#FFFFFF" stroke="#E0E9F0"/>

  <path d="M340 150 C374 62 426 62 460 150" fill="none" stroke="#168FC7" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowPrimary)"/>
  <path d="M740 150 C774 62 826 62 860 150" fill="none" stroke="#168FC7" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowPrimary)"/>
  <path d="M460 250 C426 338 374 338 340 250" fill="none" stroke="#61788A" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrowFeedback)"/>
  <path d="M860 250 C826 338 774 338 740 250" fill="none" stroke="#61788A" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrowFeedback)"/>

  <text x="400" y="50" class="label" text-anchor="middle">検証済み表現</text>
  <text x="800" y="50" class="label" text-anchor="middle">管理された表現・適用条件</text>
  <text x="400" y="376" class="label" text-anchor="middle">再定義・再検証要求</text>
  <text x="800" y="376" class="label" text-anchor="middle">選択・実行証拠</text>

  <g>
    <rect x="60" y="120" width="280" height="160" rx="18" fill="#FFFFFF" stroke="#BFDDEA" stroke-width="1.5"/>
    <line x1="84" y1="120" x2="316" y2="120" stroke="#16A3D6" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="178" class="name">Define ALPS</text>
    <text x="92" y="222" class="body">ALPS表現を定義・検証</text>
  </g>

  <g>
    <rect x="460" y="120" width="280" height="160" rx="18" fill="#F9FCFE" stroke="#9FC8E2" stroke-width="1.5"/>
    <line x1="484" y1="120" x2="716" y2="120" stroke="#0057B8" stroke-width="4" stroke-linecap="round"/>
    <text x="492" y="178" class="name">Manage ALPS</text>
    <text x="492" y="222" class="body">表現とその適用を統制</text>
  </g>

  <g>
    <rect x="860" y="120" width="280" height="160" rx="18" fill="#FFFFFF" stroke="#C4D1E1" stroke-width="1.5"/>
    <line x1="884" y1="120" x2="1116" y2="120" stroke="#001858" stroke-width="4" stroke-linecap="round"/>
    <text x="892" y="178" class="name">Apply ALPS</text>
    <text x="892" y="215" class="body"><tspan x="892">表現を読み込み</tspan><tspan x="892" dy="24">プロセスを呼び出し</tspan></text>
  </g>
</svg>
