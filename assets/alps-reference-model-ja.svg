<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ALPS参照モデル</title>
  <desc id="desc">Define ALPSからManage ALPSへ検証済み表現を渡します。Manage ALPSからApply ALPSへ管理された表現・適用条件を渡します。Apply ALPSからManage ALPSへ選択・実行証拠を渡します。Manage ALPSからDefine ALPSへ再定義・再検証要求を渡します。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#667085"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .name { font-size: 27px; font-weight: 650; letter-spacing: -0.45px; fill: #101828; }
      .description { font-size: 16px; font-weight: 450; fill: #667085; }
      .flow { font-size: 13px; font-weight: 600; fill: #475467; }
      .link { fill: none; stroke: #667085; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#FFFFFF"/>

  <text x="400" y="76" text-anchor="middle" class="flow">検証済み表現</text>
  <path d="M310 106H490" class="link"/>

  <text x="800" y="76" text-anchor="middle" class="flow">管理された表現・適用条件</text>
  <path d="M710 106H890" class="link"/>

  <text x="200" y="174" text-anchor="middle" class="name">Define ALPS</text>
  <text x="200" y="207" text-anchor="middle" class="description">
    <tspan x="200" dy="0">ALPS表現を</tspan>
    <tspan x="200" dy="24">定義・検証</tspan>
  </text>

  <text x="600" y="174" text-anchor="middle" class="name">Manage ALPS</text>
  <text x="600" y="207" text-anchor="middle" class="description">
    <tspan x="600" dy="0">表現とその適用を</tspan>
    <tspan x="600" dy="24">統制</tspan>
  </text>

  <text x="1000" y="174" text-anchor="middle" class="name">Apply ALPS</text>
  <text x="1000" y="207" text-anchor="middle" class="description">
    <tspan x="1000" dy="0">表現を読み込み</tspan>
    <tspan x="1000" dy="24">プロセスを呼び出し</tspan>
  </text>

  <path d="M490 258H310" class="link"/>
  <text x="400" y="302" text-anchor="middle" class="flow">再定義・再検証要求</text>

  <path d="M890 258H710" class="link"/>
  <text x="800" y="302" text-anchor="middle" class="flow">選択・実行証拠</text>
</svg>
