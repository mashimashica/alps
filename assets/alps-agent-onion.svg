<svg width="1600" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 1600 920" xmlns="http://www.w3.org/2000/svg">
<title>The agent exercises judgment between the meaning of work and available means</title>
<desc>Hand-drawn onion diagram. Why and What form the center. The surrounding shaded ring is the Agent, acting Judgment. The outer ring is How, with tools, data, APIs and an environment. Needs enter from the user and an outcome emerges. The rings show roles, not execution stages.</desc>
