<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ALPS Reference Model</title>
  <desc id="desc">Define ALPS sends a verified representation to Manage ALPS. Manage ALPS sends managed representations and conditions to Apply ALPS. Apply ALPS sends selection and execution evidence to Manage ALPS. Manage ALPS sends a redefinition or reverification request to Define ALPS.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#667085"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .name { font-size: 27px; font-weight: 650; letter-spacing: -0.45px; fill: #101828; }
      .description { font-size: 16px; font-weight: 450; fill: #667085; }
      .flow { font-size: 13px; font-weight: 600; fill: #475467; }
      .link { fill: none; stroke: #667085; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#FFFFFF"/>

  <text x="400" y="76" text-anchor="middle" class="flow">Verified representation</text>
  <path d="M310 106H490" class="link"/>

  <text x="800" y="76" text-anchor="middle" class="flow">Managed representations and conditions</text>
  <path d="M710 106H890" class="link"/>

  <text x="200" y="174" text-anchor="middle" class="name">Define ALPS</text>
  <text x="200" y="207" text-anchor="middle" class="description">
    <tspan x="200" dy="0">Defines and verifies</tspan>
    <tspan x="200" dy="24">ALPS representations</tspan>
  </text>

  <text x="600" y="174" text-anchor="middle" class="name">Manage ALPS</text>
  <text x="600" y="207" text-anchor="middle" class="description">
    <tspan x="600" dy="0">Governs representations</tspan>
    <tspan x="600" dy="24">and their application</tspan>
  </text>

  <text x="1000" y="174" text-anchor="middle" class="name">Apply ALPS</text>
  <text x="1000" y="207" text-anchor="middle" class="description">
    <tspan x="1000" dy="0">Activates representations</tspan>
    <tspan x="1000" dy="24">and invokes Processes</tspan>
  </text>

  <path d="M490 258H310" class="link"/>
  <text x="400" y="302" text-anchor="middle" class="flow">Redefinition or reverification request</text>

  <path d="M890 258H710" class="link"/>
  <text x="800" y="302" text-anchor="middle" class="flow">Selection and execution evidence</text>
</svg>
