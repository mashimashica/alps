name: サービス変更のプロセスモデル
description: ALPSの具体例を基にした架空のモデル。プロセス同士は、アーティファクトの型を介してだけつながる。
processes:
  - name: 要件の明確化
    purpose: サービス変更のニーズを、解決案の選択に使える程度に明確にする。
    outcomes:
      - ニーズに観察可能な受入条件がある。
      - 重要な曖昧さや矛盾が解消されているか、解決案の選択への影響とともに識別されている。
    inputs: [関係者の情報, 変更概要, 改善提案]
    outputs: [変更概要]
  - name: 実現可能性の評価
    purpose: 候補となる解決案が、利用可能な能力・容量の範囲内で明確化されたニーズを満たせるかを判断する。
    outcomes:
      - 検討した各候補の実現可能性の判断が、ニーズと利用可能な能力・容量に照らした証拠で支えられている。
      - 未確認の仮定と、それが実現可能性の判断へ与える影響が明らかになっている。
    inputs: [変更概要, 本番の観測結果]
    controls: [変更概要]
    outputs: [変更概要]
  - name: 解決案の設計
    purpose: 選んだ解決案を、実装と検査に使える構成として具体化する。
    outcomes:
      - 設計の各構成要素が、変更概要のニーズへ追跡できる。
      - 実装と検査に影響する設計判断が、その根拠とともに識別されている。
    inputs: [変更概要]
    outputs: [設計記述]
  - name: 変更の実装
    purpose: 設計記述に沿って、検査できる候補版を用意する。
    outcomes:
      - 候補版が設計記述の構成要素を実現している。
      - 候補版が版またはダイジェストで一意に識別できる。
    inputs: [設計記述]
    outputs: [候補版]
  - name: 試行での測定
    purpose: 試行条件の下で、基準と候補を比較できるリクエスト測定値を得る。
    outcomes:
      - 基準と候補の測定が、同じ試行条件で得られている。
      - 各測定の負荷、期間、環境が識別できる。
    inputs: [候補版]
    controls: [試行条件]
    outputs: [リクエスト測定値]
  - name: サービス変更の評価
    purpose: 指定された試行条件に対するサービス変更の適合性について、根拠のある判断を支える。
    outcomes:
      - 適用される各試行基準についての判断が、比較可能な測定と追跡可能な計算に裏付けられている。
      - 判断の範囲と限界が、試行の判断への影響を含めて明示されている。
    inputs: [リクエスト測定値, 試行条件]
    controls: [試行条件]
    outputs: [試行評価]
    constraints:
      - この評価は指定された試行を対象とする。本番への適合性には、本番条件に対する証拠が必要である。
    enablers:
      - 文脈を確認し、コマンドツールを利用し、結果を解釈できるエージェント
      - ローカルのPython 3.10以降の環境
  - name: 本番適用の判断
    purpose: 候補版を本番へ適用するかを、試行の証拠と受入基準に照らして決める。
    outcomes:
      - 本番へ進むかの判断が、試行評価と受入基準に照らして根拠づけられている。
      - 変更要求が、対象の候補版と変更の範囲を識別している。
    inputs: [試行評価, 変更概要, 候補版]
    controls: [受入基準]
    outputs: [変更要求]
  - name: 本番リリース
    purpose: 購入機能が動作する状態で、候補版を当該サービスの本番利用者が利用できるようにする。
    outcomes:
      - 候補版が当該サービスの本番利用者にサービスを提供している。
      - 利用者の購入経路でテスト購入が完了している。
    inputs: [候補版, 変更要求]
    controls: [本番運用方針, 受入基準]
    outputs: [デプロイされたサービスの版]
    constraints:
      - 候補版の検査は承認に、承認はデプロイに先行し、本番確認はデプロイ後に行わなければならない。
      - 候補版の変更により、先の検査と承認の根拠は無効となる。
      - 承認が不足または未確認の間は、デプロイしてはならない。
    enablers: [検査能力, 認められたリリースジョブ]
  - name: 本番の監視
    purpose: 本番のサービス状態を観察し、利用者への影響を早く識別できるようにする。
    outcomes:
      - 本番の応答性と信頼性が、サービス水準目標の指標で観察されている。
      - 目標からの逸脱が、影響範囲とともに識別されている。
    inputs: [デプロイされたサービスの版]
    controls: [サービス水準目標]
    outputs: [本番の観測結果]
  - name: インシデント対応
    purpose: 利用者に影響する障害から、サービスを許容できる状態へ回復させる。
    outcomes:
      - サービスが許容できる状態へ回復している。
      - 影響と原因の仮説が、回復の判断とともに記録されている。
    inputs: [本番の観測結果]
    controls: [本番運用方針, サービス水準目標]
    outputs: [インシデント記録]
  - name: 変更の振り返り
    purpose: 変更の適用から得た知見を、次の変更の判断に使えるようにする。
    outcomes:
      - 各成果の達成と未達成が、証拠とともに識別されている。
      - 改善案が、影響するプロセスと情報とともに識別されている。
    inputs: [試行評価, 本番の観測結果, インシデント記録]
    outputs: [改善提案]
artifacts:
  - name: 関係者の情報
    description: 関係者から得たニーズ、懸念、制約。
  - name: 変更概要
    description: このサービス変更のニーズ、候補に関する仮定、受入条件、裏付けとなる観察。ニーズと観察は入力となり、受入条件は候補を判断する統制事項となる。
  - name: 改善提案
    description: 振り返りで識別した改善案と、それが影響するプロセスと情報。
  - name: 設計記述
    description: 解決案の構成要素と、設計判断およびその根拠。
  - name: 候補版
    description: 今回のリリース対象として特定した版。版またはダイジェストで識別する。
  - name: 試行条件
    description: 試行の対象、負荷、期間、環境と、適用する試行基準。
  - name: リクエスト測定値
    description: 基準と候補のリクエスト測定値と、その測定文脈。
  - name: 試行評価
    description: 各試行基準についての判断と、その範囲と限界。
  - name: 受入基準
    description: サービスの受入基準。ヘルスエンドポイントのready応答と、テスト購入の完了を求める。
  - name: 変更要求
    description: 本番へ適用する候補版と、変更の範囲。
  - name: 本番運用方針
    description: 検査した候補版そのものへのサービス責任者の承認と、認められたリリースジョブの利用を求める方針。
  - name: デプロイされたサービスの版
    description: 本番利用者にサービスを提供している版。
  - name: サービス水準目標
    description: 本番の応答性と信頼性についての目標値。
  - name: 本番の観測結果
    description: 本番の応答性、信頼性、能力・容量についての観測。
  - name: インシデント記録
    description: 影響、対応、回復の判断、原因の仮説。
